<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeoProspects v2 — Automated Search</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy:        #0b1f4a;
  --navy-mid:    #1a3a6b;
  --navy-light:  #e8edf5;
  --navy-dim:    rgba(11,31,74,0.07);
  --orange:      #f7941d;
  --orange-h:    #e07d0a;
  --orange-dim:  rgba(247,148,29,0.12);
  --orange-glow: rgba(247,148,29,0.28);
  --bg:          #f4f6fa;
  --surface:     #ffffff;
  --surface2:    #f8f9fc;
  --border:      #dde3ee;
  --border2:     #c8d0e0;
  --text:        #1a2233;
  --text2:       #52647a;
  --text3:       #9aabbc;
  --success:     #1aab6d;
  --success-dim: rgba(26,171,109,0.1);
  --error:       #e03131;
  --error-dim:   rgba(224,49,49,0.1);
  --sh-sm:       0 1px 4px rgba(11,31,74,0.08);
  --sh-md:       0 4px 16px rgba(11,31,74,0.10);
  --sh-lg:       0 8px 32px rgba(11,31,74,0.13);
  --r:           12px;
  --r-sm:        8px;
  --font:        'Nunito Sans', sans-serif;
  --mono:        'JetBrains Mono', monospace;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
}

body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: radial-gradient(circle, rgba(11,31,74,0.06) 1px, transparent 1px);
  background-size: 28px 28px;
}

.wrap { max-width: 1020px; margin: 0 auto; padding: 0 24px 80px; position: relative; z-index: 1; }

/* ── Top Bar ──────────────────────────────────────────────────────────────── */
.topbar {
  background: var(--navy); margin: 0 -24px 36px; padding: 0 40px;
  height: 62px; display: flex; align-items: center; justify-content: space-between;
  position: relative; box-shadow: 0 2px 16px rgba(11,31,74,0.3);
}
.topbar::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 5px; background: var(--orange);
}
.brand { display: flex; align-items: center; gap: 14px; }
.brand-icon {
  width: 38px; height: 38px; border-radius: 9px; background: var(--orange);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 18px var(--orange-glow);
}
.brand-icon svg { width: 20px; height: 20px; fill: #fff; }
.brand-name { font-weight: 800; font-size: 18px; color: #fff; letter-spacing: -0.3px; }
.brand-name em { font-style: normal; color: var(--orange); }
.brand-sep { height: 22px; width: 1px; background: rgba(255,255,255,0.15); margin: 0 4px; }
.brand-sub { font-size: 12px; color: rgba(255,255,255,0.4); font-family: var(--mono); }
.topbar-v2 {
  display: flex; align-items: center; gap: 8px;
  background: rgba(247,148,29,0.15); border: 1px solid rgba(247,148,29,0.3);
  color: var(--orange); font-size: 11px; font-weight: 800;
  padding: 5px 13px; border-radius: 20px;
}
.topbar-v2::before {
  content: '⚡'; font-size: 12px;
}


/* ── Section label ────────────────────────────────────────────────────────── */
.slabel {
  font-size: 10px; font-weight: 800; letter-spacing: 2px;
  text-transform: uppercase; color: var(--navy); opacity: 0.4;
  margin-bottom: 12px; display: flex; align-items: center; gap: 10px;
}
.slabel::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ── Config grid ──────────────────────────────────────────────────────────── */
.config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }

.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 20px; box-shadow: var(--sh-sm);
  transition: border-color .2s, box-shadow .2s;
}
.panel:focus-within { border-color: var(--orange); box-shadow: 0 0 0 3px var(--orange-dim), var(--sh-sm); }

.plabel {
  font-weight: 800; font-size: 11px; letter-spacing: 1.4px;
  text-transform: uppercase; color: var(--navy);
  margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
}
.plabel .hint {
  background: var(--navy-light); color: var(--navy-mid); padding: 2px 8px;
  border-radius: 4px; font-size: 10px; letter-spacing: 0; text-transform: none; font-weight: 600;
}

textarea {
  width: 100%; background: transparent; border: none; outline: none;
  resize: none; color: var(--text); font-family: var(--mono);
  font-size: 13px; line-height: 1.7; min-height: 130px;
}
textarea::placeholder { color: var(--text3); }

/* ── Options ──────────────────────────────────────────────────────────────── */
.opts { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }

.chip {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
  padding: 9px 14px; font-size: 12px; color: var(--text2); cursor: pointer;
  transition: all .15s; flex: 1; min-width: 120px; box-shadow: var(--sh-sm);
}
.chip:hover { border-color: var(--orange); color: var(--text); }
.chip input[type=checkbox] { accent-color: var(--orange); width: 14px; height: 14px; cursor: pointer; }
.chip select {
  background: transparent; border: none; outline: none;
  color: var(--text); font-family: var(--font); font-size: 12px; flex: 1; cursor: pointer;
}
.chip select option { background: var(--surface); }

/* ── Search button ────────────────────────────────────────────────────────── */
.search-btn {
  width: 100%; padding: 16px; background: var(--orange); border: none;
  border-radius: var(--r); color: #fff; font-family: var(--font); font-weight: 800;
  font-size: 15px; cursor: pointer; box-shadow: 0 4px 20px var(--orange-glow);
  transition: all .2s; display: flex; align-items: center; justify-content: center; gap: 10px;
  margin-bottom: 28px; position: relative; overflow: hidden;
}
.search-btn::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 4px; background: rgba(255,255,255,0.3);
}
.search-btn:hover { background: var(--orange-h); transform: translateY(-1px); box-shadow: 0 6px 28px var(--orange-glow); }
.search-btn:active { transform: translateY(0); }
.search-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }

.spinner {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
  animation: spin .6s linear infinite; display: none;
}
.search-btn.loading .spinner { display: block; }
.search-btn.loading .btn-lbl { opacity: .7; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Progress bar ─────────────────────────────────────────────────────────── */
.progress-wrap { display: none; margin-bottom: 20px; }
.progress-wrap.visible { display: block; }
.progress-bar-bg {
  height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 8px;
}
.progress-bar-fill {
  height: 100%; background: var(--orange); border-radius: 2px;
  transition: width .4s ease; width: 0%;
}
.progress-log {
  font-family: var(--mono); font-size: 11px; color: var(--text2);
  max-height: 80px; overflow-y: auto;
}
.progress-log div { padding: 1px 0; }
.progress-log div::before { content: '→ '; color: var(--orange); }

/* ── Status ───────────────────────────────────────────────────────────────── */
.status {
  border-radius: var(--r-sm); padding: 11px 16px; font-size: 13px;
  display: none; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 16px;
}
.status.show { display: flex; }
.status.ok   { background: var(--success-dim); border: 1px solid rgba(26,171,109,.25); color: #0e7a4e; }
.status.err  { background: var(--error-dim);   border: 1px solid rgba(224,49,49,.25);  color: var(--error); }
.status.info { background: var(--navy-light);   border: 1px solid rgba(11,31,74,.1); border-left: 3px solid var(--orange); color: var(--navy); }

/* ── Results ──────────────────────────────────────────────────────────────── */
#results-section { display: none; }

.res-hdr {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
}
.res-hdr h2 {
  font-weight: 800; font-size: 18px; color: var(--navy);
  display: flex; align-items: center; gap: 10px;
}
.res-hdr h2::before { content: ''; width: 4px; height: 22px; background: var(--orange); border-radius: 2px; }
.res-meta { font-size: 12px; color: var(--text3); font-family: var(--mono); }
.res-actions { display: flex; gap: 8px; }

.act-btn {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sm);
  color: var(--text2); font-family: var(--font); font-size: 12px; font-weight: 700;
  padding: 8px 14px; cursor: pointer; transition: all .15s; box-shadow: var(--sh-sm);
}
.act-btn:hover { border-color: var(--navy); color: var(--navy); background: var(--navy-light); }
.act-btn.danger:hover { border-color: var(--error); color: var(--error); background: var(--error-dim); }

/* ── Company cards ────────────────────────────────────────────────────────── */
.co-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); margin-bottom: 10px; overflow: hidden;
  box-shadow: var(--sh-sm); transition: box-shadow .2s;
  animation: fadeUp .3s ease both;
}
.co-card:hover { box-shadow: var(--sh-md); }
@keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

.co-hdr {
  padding: 14px 18px; display: flex; align-items: center;
  justify-content: space-between; cursor: pointer; user-select: none;
  transition: background .15s; border-left: 3px solid transparent;
}
.co-card.open .co-hdr { border-left-color: var(--orange); background: var(--navy-light); }
.co-hdr:hover { background: var(--navy-light); }

.co-title {
  font-weight: 800; font-size: 14px; color: var(--navy);
  display: flex; align-items: center; gap: 10px;
}
.cbadge {
  background: var(--navy-light); color: var(--navy-mid);
  font-size: 11px; padding: 2px 9px; border-radius: 20px; font-weight: 700;
}
.cbadge.has { background: var(--orange-dim); color: var(--orange-h); border: 1px solid var(--orange-glow); }

.co-ctrl { display: flex; align-items: center; gap: 8px; }
.chev { color: var(--text3); font-size: 11px; transition: transform .2s; }
.co-card.open .chev { transform: rotate(180deg); }

.profs-wrap { display: none; border-top: 1px solid var(--border); }
.co-card.open .profs-wrap { display: block; }

/* ── Profile rows ─────────────────────────────────────────────────────────── */
.prow {
  padding: 12px 18px; display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--border); transition: background .12s;
  animation: fadeUp .2s ease both;
}
.prow:last-of-type { border-bottom: none; }
.prow:hover { background: var(--surface2); }

.ava {
  width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 13px; color: #fff;
}

.pinfo { flex: 1; min-width: 0; }
.pname { font-weight: 700; font-size: 14px; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prole { font-size: 12px; color: var(--text2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ploc  { font-size: 11px; color: var(--text3); margin-top: 1px; font-family: var(--mono); }

.kwtag {
  font-size: 10px; padding: 3px 9px; border-radius: 4px; flex-shrink: 0; font-weight: 700;
  background: var(--orange-dim); color: var(--orange-h);
  border: 1px solid var(--orange-glow); white-space: nowrap;
}

.lilink {
  width: 32px; height: 32px; border-radius: var(--r-sm); flex-shrink: 0;
  background: var(--navy-light); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  text-decoration: none; color: var(--navy); transition: all .15s;
}
.lilink:hover { border-color: var(--orange); background: var(--orange); color: #fff; }
.lilink svg { width: 14px; height: 14px; fill: currentColor; }
.lilink.nourl { border-style: dashed; color: var(--text3); cursor: pointer; }
.lilink.nourl:hover { border-color: var(--orange); color: var(--orange); background: var(--orange-dim); }

/* ── Toast ────────────────────────────────────────────────────────────────── */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--navy); color: #fff; padding: 10px 20px; border-radius: 20px;
  font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none;
  transition: all .25s; z-index: 9999; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Placeholder autocomplete ─────────────────────────────────────────────── */
.ac-dropdown {
  position: absolute; display: none; z-index: 1000;
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: var(--r-sm); box-shadow: var(--sh-md);
  min-width: 170px; overflow: hidden;
}
.ac-item {
  padding: 7px 14px; font-size: 12px; font-family: var(--mono);
  color: var(--navy); cursor: pointer; transition: background .1s;
}
.ac-item:hover, .ac-item.ac-sel {
  background: var(--orange-dim); color: var(--orange-h);
}

.delbtn {
  width: 26px; height: 26px; border-radius: 6px; flex-shrink: 0;
  background: transparent; border: 1px solid transparent;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text3); font-size: 12px; transition: all .15s;
}
.delbtn:hover { border-color: var(--error); color: var(--error); background: var(--error-dim); }

.empty-hint {
  padding: 28px 20px; text-align: center; color: var(--text3); font-size: 13px;
}

.addrow { padding: 10px 18px; background: var(--surface2); border-top: 1px solid var(--border); }
.addbtn {
  background: none; border: 1px dashed var(--border2); border-radius: var(--r-sm);
  color: var(--text3); font-family: var(--font); font-size: 12px; font-weight: 700;
  padding: 7px 16px; cursor: pointer; width: 100%; transition: all .15s;
}
.addbtn:hover { border-color: var(--orange); color: var(--orange); background: var(--orange-dim); }

.divider { height: 1px; background: var(--border); margin: 28px 0; }

/* ── Re-search button on card ─────────────────────────────────────────────── */
.rescan-btn {
  font-size: 11px; font-weight: 700; color: var(--navy); text-decoration: none;
  border: 1px solid var(--border2); padding: 5px 11px; border-radius: 6px;
  transition: all .15s; white-space: nowrap; background: var(--surface); cursor: pointer;
}
.rescan-btn:hover { background: var(--navy); color: #fff; border-color: var(--navy); }
.rescan-btn:disabled { opacity: .5; cursor: not-allowed; }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

@media (max-width: 600px) {
  .config-grid { grid-template-columns: 1fr; }
  .brand-sep, .brand-sub { display: none; }
  .kwtag, .ploc { display: none; }
}
</style>
</head>
<body>
<div class="wrap">

  <!-- Top Bar -->
  <div class="topbar">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
      </div>
      <div class="brand-name">Neo<em>Prospects</em></div>
      <div class="brand-sep"></div>
      <div class="brand-sub">v2 · Automated Search</div>
    </div>
    <div class="topbar-v2">Auto Search</div>
  </div>

  <!-- Config -->
  <div class="slabel">Target Configuration</div>
  <div class="config-grid">
    <div class="panel">
      <div class="plabel">Companies <span class="hint">one per line</span></div>
      <textarea id="txt-companies" placeholder="Ambev&#10;Grupo Petrópolis&#10;Coca-Cola FEMSA Brasil&#10;Nestlé Brasil&#10;Unilever Brasil&#10;P&G Brasil"></textarea>
    </div>
    <div class="panel">
      <div class="plabel">Role Keywords <span class="hint">one per line</span></div>
      <textarea id="txt-keywords" placeholder="Comprador&#10;Key Account&#10;Gerente Comercial&#10;Trade Marketing&#10;Buyer&#10;Procurement&#10;Executivo de Vendas"></textarea>
    </div>
  </div>

  <div class="panel" style="margin-top:10px">
    <div class="plabel">Outreach Message <span class="hint">optional · placeholders: {name} {first_name} {company} {title} {location}</span></div>
    <textarea id="txt-outreach" rows="4" placeholder="Hi {first_name}, I came across your profile and noticed you work as {title} at {company}. I'd love to connect!"></textarea>
  </div>

  <div class="opts">
    <label class="chip"><input type="checkbox" id="opt-br" checked> 🇧🇷 Brazil filter</label>
    <div class="chip">
      Mode:
      <select id="opt-mode">
        <option value="batch">All companies at once</option>
        <option value="single">One company at a time</option>
      </select>
    </div>
  </div>

  <!-- Search button -->
  <button class="search-btn" id="search-btn" onclick="runSearch()">
    <div class="spinner"></div>
    <span class="btn-lbl">🔍 Search LinkedIn Profiles</span>
  </button>

  <!-- Progress -->
  <div class="progress-wrap" id="progress-wrap">
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill"></div></div>
    <div class="progress-log" id="progress-log"></div>
  </div>

  <!-- Status -->
  <div class="status" id="status"></div>

  <!-- Results -->
  <div id="results-section">
    <div class="divider"></div>
    <div class="res-hdr">
      <h2>Prospects <span class="res-meta" id="results-meta"></span></h2>
      <div class="res-actions">
        <button class="act-btn" onclick="exportCSV()">⬇ Export CSV</button>
        <button class="act-btn danger" onclick="clearAll()">🗑 Clear All</button>
      </div>
    </div>
    <div id="results-body"></div>
  </div>

</div>
<div class="toast" id="toast"></div>
<div class="ac-dropdown" id="ac-dropdown"></div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
// Set this to your Vercel deployment URL after deploying the API
// It will also be saved/loaded from localStorage
const API_BASE = 'https://neoprospects-v2.vercel.app';

// ── State ─────────────────────────────────────────────────────────────────────
let STATE = {};


const AVCOLORS = [
  ['#0b1f4a','#1a3a6b'],['#c86400','#f7941d'],
  ['#1a6b3a','#2aab56'],['#6b1a1a','#a83030'],
  ['#1a3a6b','#2a5a9a'],['#4a3a0b','#7a5a14'],
];
function avaColor(n) {
  const i = ((n.charCodeAt(0)||0) + (n.charCodeAt(1)||0)) % AVCOLORS.length;
  return `linear-gradient(135deg,${AVCOLORS[i][0]},${AVCOLORS[i][1]})`;
}
function initials(n) { return n.split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?'; }

// ── Persistence ───────────────────────────────────────────────────────────────
function save()    { try{localStorage.setItem('np2_state',JSON.stringify(STATE));}catch(e){} }
function load()    { try{const r=localStorage.getItem('np2_state');STATE=r?JSON.parse(r):{};}catch(e){STATE={};} }
function saveCfg() {
  try{ localStorage.setItem('np2_cfg', JSON.stringify({
    co: g('txt-companies').value, kw: g('txt-keywords').value,
    msg: g('txt-outreach').value,
  })); }catch(e){}
}
function loadCfg() {
  try{
    const r=localStorage.getItem('np2_cfg'); if(!r) return;
    const c=JSON.parse(r);
    if(c.co)  g('txt-companies').value = c.co;
    if(c.kw)  g('txt-keywords').value  = c.kw;
    if(c.msg) g('txt-outreach').value  = c.msg;
    g('opt-br').checked = c.br !== false;
    if(c.mode) g('opt-mode').value = c.mode;
  }catch(e){}
}

// ── Main search ───────────────────────────────────────────────────────────────
async function runSearch() {
  const companies = getCos();
  const keywords  = getKws();
  const brOnly    = g('opt-br').checked;
  const mode      = g('opt-mode').value;

  if (!companies.length) return setStatus('err', 'Enter at least one company.');
  if (!keywords.length)  return setStatus('err', 'Enter at least one keyword.');

  

  saveCfg();
  const btn = g('search-btn');
  btn.classList.add('loading'); btn.disabled = true;
  setStatus('info', `Searching ${companies.length} company(ies)…`);
  showProgress(true);
  logProgress(`Starting search for ${companies.length} companies…`);

  try {
    if (mode === 'batch') {
      await runBatchSearch(companies, keywords, brOnly);
    } else {
      await runSequentialSearch(companies, keywords, brOnly);
    }
  } catch(e) {
    setStatus('err', `Search failed: ${e.message}`);
  } finally {
    btn.classList.remove('loading'); btn.disabled = false;
    showProgress(false);
  }
}

async function runBatchSearch(companies, keywords, brOnly) {
  logProgress('Sending batch request to API…');
  setProgress(20);

  const r = await fetch(`${API_BASE}/api/search/batch`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ companies, keywords, brOnly })
  });

  if (!r.ok) {
    const e = await r.json().catch(()=>({}));
    throw new Error(e.error || `API error ${r.status}`);
  }

  setProgress(80);
  const data = await r.json();

  // Merge into STATE
  let added = 0;
  Object.entries(data.results).forEach(([co, profiles]) => {
    if (!STATE[co]) STATE[co] = [];
    profiles.forEach(p => {
      const exists = STATE[co].some(x => x.name?.toLowerCase() === p.name?.toLowerCase());
      if (!exists && p.name) { STATE[co].push({ ...p, addedAt: Date.now() }); added++; }
    });
  });

  setProgress(100);
  save(); render();
  setStatus('ok', `✓ Found ${data.total} profiles across ${data.companies} companies.`);
  logProgress(`Done — ${data.total} profiles found.`);
}

async function runSequentialSearch(companies, keywords, brOnly) {
  let total = 0;
  for (let i = 0; i < companies.length; i++) {
    const co = companies[i];
    const pct = Math.round(((i) / companies.length) * 100);
    setProgress(pct);
    logProgress(`Searching: ${co}…`);

    try {
      const r = await fetch(`${API_BASE}/api/search`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ company: co, keywords, brOnly })
      });

      if (!r.ok) { logProgress(`✗ ${co}: API error ${r.status}`); continue; }

      const data = await r.json();
      if (!STATE[co]) STATE[co] = [];

      data.profiles.forEach(p => {
        const exists = STATE[co].some(x => x.name?.toLowerCase() === p.name?.toLowerCase());
        if (!exists && p.name) { STATE[co].push({ ...p, addedAt: Date.now() }); total++; }
      });

      logProgress(`✓ ${co}: ${data.profiles.length} profiles`);
      save(); render();
    } catch(e) {
      logProgress(`✗ ${co}: ${e.message}`);
    }
  }

  setProgress(100);
  setStatus('ok', `✓ Search complete — ${total} new profiles found.`);
}

// ── Rescan single company ─────────────────────────────────────────────────────
async function rescanCompany(co, btnEl) {


  const keywords = getKws();
  const brOnly   = g('opt-br').checked;

  btnEl.disabled = true; btnEl.textContent = '⏳';

  try {
    const r = await fetch(`${API_BASE}/api/search`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ company: co, keywords, brOnly })
    });
    const data = await r.json();

    if (!STATE[co]) STATE[co] = [];
    let added = 0;
    data.profiles.forEach(p => {
      const exists = STATE[co].some(x => x.name?.toLowerCase() === p.name?.toLowerCase());
      if (!exists && p.name) { STATE[co].push({ ...p, addedAt: Date.now() }); added++; }
    });

    save(); render();
    setStatus('ok', `✓ ${co}: found ${data.profiles.length} profiles (${added} new).`);
  } catch(e) {
    setStatus('err', `Error: ${e.message}`);
  } finally {
    btnEl.disabled = false; btnEl.textContent = '↻ Re-search';
  }
}

// ── Progress helpers ──────────────────────────────────────────────────────────
function showProgress(on) {
  g('progress-wrap').className = on ? 'progress-wrap visible' : 'progress-wrap';
  if (on) { g('progress-log').innerHTML = ''; setProgress(0); }
}
function setProgress(pct) { g('progress-fill').style.width = pct + '%'; }
function logProgress(msg) {
  const d = document.createElement('div');
  d.textContent = msg;
  g('progress-log').appendChild(d);
  g('progress-log').scrollTop = 99999;
}

// ── Status ────────────────────────────────────────────────────────────────────
function setStatus(type, msg) {
  const el = g('status');
  el.className = `status show ${type}`; el.textContent = msg;
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const sec = g('results-section'), body = g('results-body');
  const cos = Object.keys(STATE);
  if (!cos.length) { sec.style.display = 'none'; return; }

  const total = Object.values(STATE).reduce((s,a) => s+a.length, 0);
  g('results-meta').textContent = `— ${cos.length} companies · ${total} profiles`;
  sec.style.display = 'block';
  body.innerHTML = '';

  cos.forEach((co, ci) => {
    const profs = STATE[co] || [], hasData = profs.length > 0;
    const card = document.createElement('div');
    card.className = 'co-card open'; // open by default
    card.style.animationDelay = `${ci * 0.05}s`;
    card.innerHTML = `
      <div class="co-hdr" onclick="toggleCard(this)">
        <div class="co-title">
          ${esc(co)}
          <span class="cbadge ${hasData?'has':''}">${profs.length} profile${profs.length!==1?'s':''}</span>
        </div>
        <div class="co-ctrl">
          <button class="rescan-btn" onclick="event.stopPropagation(); rescanCompany('${esc(co)}', this)">↻ Re-search</button>
          <span class="chev">▾</span>
        </div>
      </div>
      <div class="profs-wrap">
        ${profs.length === 0
          ? `<div class="empty-hint">No profiles found yet — click <strong>↻ Re-search</strong> or run a full search above.</div>`
          : profs.map((p, pi) => profRow(p, ci, pi, co)).join('')}
        <div class="addrow"><button class="addbtn" onclick="addManual(${ci},'${esc(co)}')">+ Add manually</button></div>
      </div>`;
    body.appendChild(card);
  });
}

function profRow(p, ci, pi, co) {
  const name = p.name || 'Unknown', url = p.url || '';
  return `<div class="prow">
    <div class="ava" style="background:${avaColor(name)}">${initials(name)}</div>
    <div class="pinfo">
      <div class="pname">${esc(name)}</div>
      <div class="prole">${esc(p.title||'')}${p.company&&p.company!==co?' · '+esc(p.company):''}</div>
      ${p.location?`<div class="ploc">📍 ${esc(p.location)}</div>`:''}
    </div>
    ${p.matched?`<span class="kwtag">${esc(p.matched)}</span>`:''}
    ${url
      ? `<button class="lilink" onclick="liClick('${esc(url)}',STATE['${esc(co)}'][${pi}])" title="Copy message &amp; open LinkedIn">
           <svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
         </button>`
      : `<button class="lilink nourl" onclick="addUrl('${esc(co)}',${pi})" title="Add LinkedIn URL">
           <svg viewBox="0 0 24 24" style="width:12px;height:12px;fill:currentColor"><path d="M12 5v14M5 12h14"/></svg>
         </button>`
    }
    <button class="delbtn" onclick="delProf('${esc(co)}',${pi})">✕</button>
  </div>`;
}

function toggleCard(hdr) { hdr.closest('.co-card').classList.toggle('open'); }

// ── Manual add / edit URL ─────────────────────────────────────────────────────
function addManual(ci, co) {
  const name  = prompt(`Name (at ${co}):`); if(!name) return;
  const title = prompt('Job title:') || '';
  const url   = prompt('LinkedIn URL (optional):') || '';
  const kws   = getKws();
  const matched = kws.find(k => title.toLowerCase().includes(k.toLowerCase())) || '';
  if (!STATE[co]) STATE[co] = [];
  STATE[co].push({ name, title, company: co, url, location: '', matched, addedAt: Date.now() });
  save(); render();
}

function addUrl(co, idx) {
  const p = STATE[co]?.[idx]; if(!p) return;
  const url = prompt(`LinkedIn URL for ${p.name}:`, p.url||'https://www.linkedin.com/in/');
  if (url === null) return;
  STATE[co][idx].url = url.trim();
  save(); render();
}

function delProf(co, idx) {
  if (!STATE[co]) return;
  STATE[co].splice(idx, 1); save(); render();
}

function clearAll() {
  if (!confirm('Clear all prospects?')) return;
  STATE = {}; save(); g('results-section').style.display = 'none';
}

// ── Outreach template ─────────────────────────────────────────────────────────
function fillTemplate(tpl, p) {
  const firstName = (p.name || '').split(/\s+/)[0];
  return tpl
    .replace(/\{name\}/g,       p.name     || '')
    .replace(/\{first_name\}/g, firstName  || '')
    .replace(/\{company\}/g,    p.company  || '')
    .replace(/\{title\}/g,      p.title    || '')
    .replace(/\{location\}/g,   p.location || '');
}

function showToast(msg) {
  const t = g('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function liClick(url, p) {
  const tpl = g('txt-outreach').value.trim();
  if (tpl) {
    try {
      await navigator.clipboard.writeText(fillTemplate(tpl, p));
      showToast('Message copied! Opening LinkedIn…');
    } catch(e) {
      showToast('Could not copy — opening LinkedIn…');
    }
  }
  window.open(url, '_blank');
}

// ── CSV export ────────────────────────────────────────────────────────────────
function exportCSV() {
  const rows = [['Company','Name','Job Title','Matched Keyword','LinkedIn URL','Location','Added']];
  Object.entries(STATE).forEach(([co, ps]) =>
    ps.forEach(p => rows.push([co, p.name||'', p.title||'', p.matched||'', p.url||'', p.location||'',
      p.addedAt ? new Date(p.addedAt).toLocaleDateString('pt-BR') : '']))
  );
  const csv  = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], { type: 'text/csv;charset=utf-8;' });
  const a    = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `prospects_v2_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
}

// ── Placeholder autocomplete ───────────────────────────────────────────────────
const AC_PLACEHOLDERS = ['name', 'first_name', 'company', 'title', 'location'];
let _acIdx = 0;

function acContext(ta) {
  const val = ta.value, cur = ta.selectionStart;
  for (let i = cur - 1; i >= 0; i--) {
    if (val[i] === '}' || val[i] === '\n') return null;
    if (val[i] === '{') {
      const query = val.slice(i + 1, cur);
      return /\s/.test(query) ? null : { brace: i, query };
    }
  }
  return null;
}

function acCaretPos(ta) {
  const cs = window.getComputedStyle(ta);
  const div = document.createElement('div');
  ['fontFamily','fontSize','fontWeight','lineHeight','letterSpacing',
   'paddingTop','paddingRight','paddingBottom','paddingLeft',
   'borderTopWidth','borderRightWidth','borderBottomWidth','borderLeftWidth',
   'boxSizing'].forEach(p => div.style[p] = cs[p]);
  const r = ta.getBoundingClientRect();
  div.style.cssText += `;position:fixed;top:${r.top}px;left:${r.left}px;` +
    `width:${r.width}px;height:${r.height}px;visibility:hidden;` +
    `white-space:pre-wrap;word-break:break-word;overflow:hidden;`;
  div.appendChild(document.createTextNode(ta.value.slice(0, ta.selectionStart)));
  const span = document.createElement('span');
  span.textContent = '\u200b';
  div.appendChild(span);
  document.body.appendChild(div);
  const sr = span.getBoundingClientRect();
  const lh = parseFloat(cs.lineHeight) || parseFloat(cs.fontSize) * 1.4;
  document.body.removeChild(div);
  return { top: sr.bottom + window.scrollY + 2, left: sr.left + window.scrollX };
}

function acUpdate(ta) {
  const dd = g('ac-dropdown');
  const ctx = acContext(ta);
  if (!ctx) { dd.style.display = 'none'; return; }
  const matches = AC_PLACEHOLDERS.filter(p => p.startsWith(ctx.query.toLowerCase()));
  if (!matches.length) { dd.style.display = 'none'; return; }
  _acIdx = 0;
  dd.innerHTML = matches.map((p, i) =>
    `<div class="ac-item${i === 0 ? ' ac-sel' : ''}" data-val="${p}">{${p}}</div>`
  ).join('');
  dd.querySelectorAll('.ac-item').forEach(el =>
    el.addEventListener('mousedown', e => { e.preventDefault(); acInsert(ta, el.dataset.val); })
  );
  const pos = acCaretPos(ta);
  dd.style.top  = pos.top  + 'px';
  dd.style.left = pos.left + 'px';
  dd.style.display = 'block';
}

function acHide() { g('ac-dropdown').style.display = 'none'; }

function acInsert(ta, placeholder) {
  const ctx = acContext(ta);
  if (!ctx) return;
  const before = ta.value.slice(0, ctx.brace);
  const after  = ta.value.slice(ta.selectionStart);
  ta.value = before + '{' + placeholder + '}' + after;
  const cur = ctx.brace + placeholder.length + 2;
  ta.setSelectionRange(cur, cur);
  acHide();
  saveCfg();
}

function acKeydown(e, ta) {
  const dd = g('ac-dropdown');
  if (dd.style.display === 'none') return;
  const items = dd.querySelectorAll('.ac-item');
  if (!items.length) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    _acIdx = Math.min(_acIdx + 1, items.length - 1);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    _acIdx = Math.max(_acIdx - 1, 0);
  } else if (e.key === 'Tab' || e.key === 'Enter') {
    e.preventDefault();
    acInsert(ta, items[_acIdx].dataset.val);
    return;
  } else if (e.key === 'Escape') {
    acHide(); return;
  } else { return; }
  items.forEach((el, i) => el.classList.toggle('ac-sel', i === _acIdx));
}

// ── Utils ─────────────────────────────────────────────────────────────────────
function g(id) { return document.getElementById(id); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function getCos(){ return g('txt-companies').value.split('\n').map(s=>s.trim()).filter(Boolean); }
function getKws() { return g('txt-keywords').value.split('\n').map(s=>s.trim()).filter(Boolean); }

['txt-companies','txt-keywords','txt-outreach'].forEach(id => g(id).addEventListener('input', saveCfg));

// autocomplete wiring
(function() {
  const ta = g('txt-outreach');
  ta.addEventListener('input',   () => acUpdate(ta));
  ta.addEventListener('keydown', e  => acKeydown(e, ta));
  ta.addEventListener('blur',    () => setTimeout(acHide, 150));
})();

// ── Init ──────────────────────────────────────────────────────────────────────
load(); loadCfg();
if (Object.keys(STATE).length) render();
